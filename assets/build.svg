<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="What I build: mobile apps, web backends, systems and data.">
  <style>
    :root { --card:#161b22; --line:#30363d; --text:#e6edf3; --muted:#8b949e; --a:#58a6ff; --b:#bc8cff; --c:#3fb950; --chip:#21262d; }
    @media (prefers-color-scheme: light) {
      :root { --card:#ffffff; --line:#d0d7de; --text:#1f2328; --muted:#59636e; --a:#0969da; --b:#8250df; --c:#1a7f37; --chip:#f3f4f6; }
    }
    text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .h { font-size: 20px; font-weight: 700; fill: var(--text); }
    .p { font-size: 13px; fill: var(--muted); }
    .t { font-size: 11.5px; font-weight: 600; fill: var(--text); }
    .card { animation: rise .8s ease-out both; }
    .c2 { animation-delay: .15s; } .c3 { animation-delay: .3s; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="var(--a)"/><stop offset="1" stop-color="var(--b)"/></linearGradient>
    <linearGradient id="g2" x1="0" x2="1"><stop offset="0" stop-color="var(--b)"/><stop offset="1" stop-color="var(--c)"/></linearGradient>
    <linearGradient id="g3" x1="0" x2="1"><stop offset="0" stop-color="var(--c)"/><stop offset="1" stop-color="var(--a)"/></linearGradient>
  </defs>

  <!-- Card 1: Mobile -->
  <g class="card">
    <rect x="1" y="1" width="318" height="248" rx="16" fill="var(--card)" stroke="var(--line)"/>
    <rect x="1" y="1" width="318" height="5" rx="2.5" fill="url(#g1)"/>
    <rect x="24" y="30" width="44" height="44" rx="12" fill="url(#g1)"/>
    <rect x="38" y="38" width="16" height="28" rx="4" fill="none" stroke="#fff" stroke-width="2.5"/>
    <text x="82" y="58" class="h">Mobile</text>
    <text x="82" y="76" class="p">Native &amp; cross-platform apps</text>
    <text x="24" y="116" class="p">From a first Play Store release at 11 to</text>
    <text x="24" y="134" class="p">polished Android, Flutter and macOS apps.</text>
    <g class="mono">
      <rect x="24" y="158" width="64" height="26" rx="13" fill="var(--chip)" stroke="var(--line)"/><text x="56" y="175" text-anchor="middle" class="t">Kotlin</text>
      <rect x="96" y="158" width="68" height="26" rx="13" fill="var(--chip)" stroke="var(--line)"/><text x="130" y="175" text-anchor="middle" class="t">Flutter</text>
      <rect x="172" y="158" width="58" height="26" rx="13" fill="var(--chip)" stroke="var(--line)"/><text x="201" y="175" text-anchor="middle" class="t">Swift</text>
      <rect x="24" y="192" width="64" height="26" rx="13" fill="var(--chip)" stroke="var(--line)"/><text x="56" y="209" text-anchor="middle" class="t">Android</text>
      <rect x="96" y="192" width="58" height="26" rx="13" fill="var(--chip)" stroke="var(--line)"/><text x="125" y="209" text-anchor="middle" class="t">macOS</text>
    </g>
  </g>

  <!-- Card 2: Web -->
  <g transform="translate(340 0)">
    <g class="card c2">
    <rect x="1" y="1" width="318" height="248" rx="16" fill="var(--card)" stroke="var(--line)"/>
    <rect x="1" y="1" width="318" height="5" rx="2.5" fill="url(#g2)"/>
    <rect x="24" y="30" width="44" height="44" rx="12" fill="url(#g2)"/>
    <path d="M42 44l-8 8 8 8M54 44l8 8-8 8" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(-2 4)"/>
    <text x="82" y="58" class="h">Web</text>
    <text x="82" y="76" class="p">Laravel systems &amp; backends</text>
    <text x="24" y="116" class="p">APIs, dashboards and admin systems,</text>
    <text x="24" y="134" class="p">plus WordPress sites when needed.</text>
    <g class="mono">
      <rect x="24" y="158" width="68" height="26" rx="13" fill="var(--chip)" stroke="var(--line)"/><text x="58" y="175" text-anchor="middle" class="t">Laravel</text>
      <rect x="100" y="158" width="48" height="26" rx="13" fill="var(--chip)" stroke="var(--line)"/><text x="124" y="175" text-anchor="middle" class="t">PHP</text>
      <rect x="156" y="158" width="86" height="26" rx="13" fill="var(--chip)" stroke="var(--line)"/><text x="199" y="175" text-anchor="middle" class="t">WordPress</text>
      <rect x="24" y="192" width="48" height="26" rx="13" fill="var(--chip)" stroke="var(--line)"/><text x="48" y="209" text-anchor="middle" class="t">JS</text>
      <rect x="80" y="192" width="58" height="26" rx="13" fill="var(--chip)" stroke="var(--line)"/><text x="109" y="209" text-anchor="middle" class="t">React</text>
    </g>
    </g>
  </g>

  <!-- Card 3: Systems & Data -->
  <g transform="translate(680 0)">
    <g class="card c3">
    <rect x="1" y="1" width="318" height="248" rx="16" fill="var(--card)" stroke="var(--line)"/>
    <rect x="1" y="1" width="318" height="5" rx="2.5" fill="url(#g3)"/>
    <rect x="24" y="30" width="44" height="44" rx="12" fill="url(#g3)"/>
    <g fill="none" stroke="#fff" stroke-width="2.5">
      <ellipse cx="46" cy="44" rx="11" ry="4.5"/>
      <path d="M35 44v14c0 2.5 5 4.5 11 4.5s11-2 11-4.5V44"/>
      <path d="M35 51c0 2.5 5 4.5 11 4.5s11-2 11-4.5"/>
    </g>
    <text x="82" y="58" class="h">Systems &amp; Data</text>
    <text x="82" y="76" class="p">Storage, queries, open source</text>
    <text x="24" y="116" class="p">Relational schemas and contributions to</text>
    <text x="24" y="134" class="p">Rust and related open-source projects.</text>
    <g class="mono">
      <rect x="24" y="158" width="92" height="26" rx="13" fill="var(--chip)" stroke="var(--line)"/><text x="70" y="175" text-anchor="middle" class="t">PostgreSQL</text>
      <rect x="124" y="158" width="62" height="26" rx="13" fill="var(--chip)" stroke="var(--line)"/><text x="155" y="175" text-anchor="middle" class="t">MySQL</text>
      <rect x="194" y="158" width="52" height="26" rx="13" fill="var(--chip)" stroke="var(--line)"/><text x="220" y="175" text-anchor="middle" class="t">Rust</text>
      <rect x="24" y="192" width="48" height="26" rx="13" fill="var(--chip)" stroke="var(--line)"/><text x="48" y="209" text-anchor="middle" class="t">Git</text>
      <rect x="80" y="192" width="80" height="26" rx="13" fill="var(--chip)" stroke="var(--line)"/><text x="120" y="209" text-anchor="middle" class="t">Postman</text>
    </g>
    </g>
  </g>
</svg>
